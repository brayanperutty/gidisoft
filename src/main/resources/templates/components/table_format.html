<h5 th:if="${#lists.isEmpty(formats)}"
    class="text-center mt-4 text-muted" th:fragment="table(formats)">
    No hay formatos registrados
</h5>

<div th:fragment="table(formats)" th:if="${not #lists.isEmpty(formats)}" class="table-responsive mt-1">
    <table class="table table-striped table-bordered teachers-table">
        <thead class="table-dark">
        <tr>
            <th>Código</th>
            <th>Nombre</th>
            <th>Correo</th>
            <th>Rol</th>
            <th>Estado</th>
            <th>Acciones</th>
        </tr>
        </thead>
        <tbody th:each="format: ${formats}">
        <tr>
            <td th:text="${format.code}" class="usercode"></td>
            <td th:text="${format.name}"></td>
            <td th:text="${format.director}"></td>
            <td th:text="${format.deparment}"></td>
            <td th:text="${format.faculty}"></td>
            <td th:text="${format.year}"></td>
            <td th:text="${format.period}"></td>
            <td>
                <a class="btn btn-primary btn-sm"><i class="fas fa-edit"></i></a>
                <a class="btn btn-danger btn-sm delete"
                   data-bs-toggle="modal" data-bs-target="#confirmDeleteModal">
                    <i class="fas fa-trash-alt"></i>
                </a>
                <a class="btn btn-warning btn-sm toggle-status activate"
                   data-bs-toggle="modal" data-bs-target="#confirmActivateModal">
                    <i class="fas fa-power-off"></i>
                </a>
            </td>
        </tr>
        </tbody>
    </table>
</div>
