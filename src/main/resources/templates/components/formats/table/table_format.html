<h5 th:if="${#lists.isEmpty(formats)}"
    class="text-center mt-4 text-muted" th:fragment="table(formats)">
    No hay formatos registrados
</h5>

<table th:fragment="table(formats)" th:if="${not #lists.isEmpty(formats)}"
       class="table table-striped table-bordered teachers-table">
    <thead class="table-dark">
    <tr>
        <th class="d-none">id</th>
        <th>Código</th>
        <th>Nombre</th>
        <th>Director</th>
        <th>Período</th>
        <th>Estado</th>
        <th>Acciones</th>
    </tr>
    </thead>
    <tbody>
    <tr th:each="format: ${formats}">
        <td th:text="${format.id}" class="d-none id"></td>
        <td th:text="${format.code}"></td>
        <td th:text="${format.name}"></td>
        <td th:text="${format.director}"></td>
        <td th:text="${format.period}"></td>
        <td th:text="${format.status}"></td>
        <td>
            <a class="btn btn-primary btn-sm"
               th:href="@{/formats/{id}(id=${format.id})}"
               title="Editar">
                <i class="fas fa-edit"></i></a>
            <a class="btn btn-danger btn-sm delete"
               data-bs-toggle="modal" data-bs-target="#confirmDeleteFormatModal"
               th:if="${user.roleType == 'admin'}"
               title="Eliminar">
                <i class="fas fa-trash-alt"></i>
            </a>
            <a class="btn btn-warning btn-sm toggle-status publishFormat"
               data-bs-toggle="modal" data-bs-target="#confirmPublishFormatModal"
               th:if="${format.statusId != 2}"
               title="Publicar">
                <i class="fas fa-power-off"></i>
            </a>
        </td>
    </tr>
    </tbody>
</table>
