<h5 th:if="${#lists.isEmpty(formats) && user.roleType == 'admin'}"
    class="text-center mt-4 text-muted" th:fragment="table(formats)">
    No hay formatos registrados
</h5>

<h5 th:if="${#lists.isEmpty(formats) && user.roleType != 'admin'}"
    class="text-center mt-4 text-muted" th:fragment="table(formats)">
    No cuenta con formatos compartidos
</h5>

<div th:fragment="table(formats)" th:if="${not #lists.isEmpty(formats)}" class="table-responsive mt-1">
    <table class="table table-striped table-bordered teachers-table">
        <thead class="table-dark">
        <tr>
            <th class="d-none">id</th>
            <th>Código</th>
            <th>Nombre</th>
            <th>Director</th>
            <th>Período</th>
            <th>Estado</th>
            <th>Acciones</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="format: ${formats}">
            <td th:text="${format.id}" class="d-none id"></td>
            <td th:text="${format.code}"></td>
            <td th:text="${format.name}"></td>
            <td th:text="${format.director}"></td>
            <td th:text="${format.period}"></td>
            <td th:text="${format.status}"></td>
            <td>
                <a class="btn btn-primary btn-sm"
                   th:href="@{/formats/{id}(id=${format.id})}"
                   title="Editar">
                    <i class="fas fa-edit"></i></a>
                <a class="btn btn-info btn-sm"
                   th:if="${user.roleType == 'admin'}"
                   data-bs-toggle="modal"
                   th:attr="data-bs-target='#permisosModal__' + ${format.id}"
                   title="Permisos">
                    <i class="fas fa-user-shield"></i></a>
                <a class="btn btn-danger btn-sm delete"
                   data-bs-toggle="modal" data-bs-target="#confirmDeleteFormatModal"
                   th:if="${user.roleType == 'admin'}"
                   title="Eliminar">
                    <i class="fas fa-trash-alt"></i>
                </a>
                <a class="btn btn-warning btn-sm toggle-status publishFormat"
                   data-bs-toggle="modal" data-bs-target="#confirmPublishFormatModal"
                   th:if="${format.statusId != 2}"
                   title="Publicar">
                    <i class="fas fa-power-off"></i>
                </a>
            </td>
        </tr>
        </tbody>
    </table>
    <div th:each="format : ${formats}">
        <div class="modal fade" th:id="'permisosModal__' + ${format.id}" tabindex="-1"
             aria-labelledby="permisosModalLabel" aria-hidden="true">
            <div class="modal-dialog modal-dialog-centered modal-lg">
                <div class="modal-content">
                    <div class="modal-header bg-info text-white">
                        <h5 class="modal-title">Gestionar Permisos - Formato:
                            <span th:text="${format.code} + ' - ' + ${format.period}"></span>
                        </h5>
                        <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Cerrar"></button>
                    </div>
                    <form th:action="@{/formats/{id}/permissions(id=${format.id})}" method="post">
                        <div class="modal-body">
                            <div class="form-group">
                                <label for="usuarios" class="mb-3">Selecciona los usuarios con acceso:</label>
                                <select id="usuarios" class="form-select mb-3" multiple name="users">
                                    <option th:each="usuario : ${users}"
                                            th:value="${usuario.id}"
                                            th:text="${usuario.usercode} + ' - ' + ${usuario.name}">
                                    </option>
                                </select>
                                <small class="form-text text-muted">Mantén presionada Ctrl (o Cmd en Mac) para
                                    seleccionar múltiples usuarios.</small>
                            </div>
                        </div>
                        <div class="modal-footer">
                            <button type="submit" class="btn btn-success">Guardar Permisos</button>
                            <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancelar</button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
