<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard - GIDISOFT</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">
    <link rel="stylesheet" th:href="@{/css/dashboard.css}">
</head>
<body>

<!-- Menú lateral -->
<div class="sidebar collapsed" id="sidebar">
    <div th:replace="~{components/utils/menu}"></div>
</div>

<div id="successToast" class="toast align-items-center text-white bg-success border-0 position-fixed top-0 start-0 m-3"
     role="alert" aria-live="assertive" aria-atomic="true" data-bs-delay="2000">
    <div class="d-flex">
        <div class="toast-body">
            <span th:text="${message}"></span>
        </div>
        <button type="button" class="btn-close btn-close-white me-2 m-auto" data-bs-dismiss="toast"
                aria-label="Close"></button>
    </div>
</div>

<div id="errorToast" class="toast align-items-center text-white bg-danger border-0 position-fixed top-0 start-0 m-3"
     role="alert" aria-live="assertive" aria-atomic="true" data-bs-delay="2000">
    <div class="d-flex">
        <div class="toast-body">
            <span th:text="${createError}"></span>
        </div>
        <button type="button" class="btn-close btn-close-white me-2 m-auto" data-bs-dismiss="toast"
                aria-label="Close"></button>
    </div>
</div>

<div class="content" id="content">
    <div th:replace="~{components/utils/header-user :: header(${user})}"></div>

    <div class="container mt-5">

        <!--  Esto es lo nuevo con taps-->
        <ul class="nav custom-tabs mb-4" id="formatTabs" role="tablist">
            <li class="nav-item" role="presentation">
                <button class="nav-link"
                        id="tab-general-tab"
                        data-bs-toggle="tab"
                        data-bs-target="#tab-general"
                        type="button"
                        role="tab"
                        th:classappend="${tab} == 'general' ? ' active' : ''"
                        th:aria-selected="${tab} == 'general' ? 'true' : 'false'">
                    Información general
                </button>
            </li>
            <li class="nav-item" role="presentation">
                <button class="nav-link"
                        id="tab-modules-tab"
                        data-bs-toggle="tab"
                        data-bs-target="#tab-modules"
                        type="button"
                        role="tab"
                        th:classappend="${tab} == 'modules' ? ' active' : ''"
                        th:aria-selected="${tab} == 'modules' ? 'true' : 'false'">
                    Módulos
                </button>
            </li>
            <li class="nav-item" role="presentation">
                <button class="nav-link"
                        id="tab-products-tab"
                        data-bs-toggle="tab"
                        data-bs-target="#tab-products"
                        type="button"
                        role="tab"
                        th:classappend="${tab} == 'products' ? ' active' : ''"
                        th:aria-selected="${tab} == 'products' ? 'true' : 'false'">
                    Productos
                </button>
            </li>
        </ul>
        <!-- Aquí termina lo de taps-->

        <div class="tab-content" id="formatTabsContent" >
            <!-- TAB 1: Información general -->
            <div class="tab-pane fade"
                 id="tab-general"
                 role="tabpanel"
                 th:classappend="${tab} == 'general' ? ' show active' : ''">
                <form th:action="@{/formats}" method="post" th:object="${formatRequest}">
                    <div th:replace="~{components/formats/general_info/form-format :: formularioBasico(${formatRequest})}"></div>
                    <div class="mt-4 text-end mb-3">
                        <button type="submit" class="btn btn-primary">Guardar información general</button>
                    </div>
                </form>
            </div>

            <!-- TAB 2: Módulos -->
            <div class="tab-pane fade"
                 id="tab-modules"
                 role="tabpanel"
                 th:classappend="${tab} == 'modules' ? ' show active' : ''">
                <div th:if="${formatRequest.formatId != null}">
                    <div th:replace="~{components/formats/modules/modules-format :: modulosExtra(${projects})}"></div>
                </div>
            </div>

            <!-- TAB 3: Productos -->
            <div class="tab-pane fade"
                 id="tab-products"
                 role="tabpanel"
                 th:classappend="${tab} == 'products' ? ' show active' : ''">
                <div th:replace="~{components/formats/modules/products-format :: products(${groupedProducts})}"></div>
            </div>
        </div>

<!--        <form th:action="@{/formats}" method="post" th:object="${formatRequest}">-->
<!--            <div th:replace="~{components/formats/general_info/form-format :: formularioBasico(${formatRequest})}"></div>-->
<!--            <div class="mt-4 text-end mb-3">-->
<!--                <button type="submit" class="btn btn-primary">Guardar información general</button>-->
<!--            </div>-->
<!--        </form>-->
<!--        <div th:if="${formatRequest.formatId != null}">-->
<!--            <div th:replace="~{components/formats/modules/modules-format :: modulosExtra(${projects})}"></div>-->
<!--        </div>-->

    </div>
</div>
<!-- Bootstrap y JS -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script th:src="@{/js/components/utils/togglebtn.js}"></script>
<script th:src="@{/js/components/utils/alert.js}"></script>
<script th:src="@{/js/components/users/delete_teacher.js}"></script>
<script th:src="@{/js/components/users/activate.js}"></script>
<script th:type="module" th:src="@{/js/components/events/events_format.js}"></script>
<script th:src="@{/js/components/events/delete_event.js}"></script>
<script th:type="module" th:src="@{/js/components/activities/other_activities_format.js}"></script>
<script th:src="@{/js/components/activities/other_activities_delete.js}"></script>
<script th:type="module" th:src="@{/js/components/products/products_format.js}"></script>
<script th:src="@{/js/components/products/delete_product.js}"></script>
<script th:type="module" th:src="@{/js/components/directions/directions_format.js}"></script>
<script th:src="@{/js/components/directions/delete_direction.js}"></script>
<script th:src="@{/js/components/directions/filter_selects.js}"></script>
<script th:type="module" th:src="@{/js/components/projects/projects_format.js}"></script>
<script th:src="@{/js/components/projects/file_uploader.js}"></script>
<script th:src="@{/js/components/utils/charge_evidences.js}"></script>
<script th:src="@{/js/components/projects/delete_project.js}"></script>
<script th:src="@{/js/components/utils/complianceHandler.js}"></script>
<script th:src="@{/js/components/utils/complianceHandlerOld.js}"></script>
<script th:src="@{/js/components/utils/view_carrousel.js}"></script>
</body>
</html>
