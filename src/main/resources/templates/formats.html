<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard - GIDISOFT</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">
    <link rel="stylesheet" th:href="@{/css/dashboard.css}">
</head>
<body>

<!-- Menú lateral -->
<div class="sidebar collapsed" id="sidebar">
    <div th:replace="~{components/utils/menu}"></div>
</div>

<div id="successToast" class="toast align-items-center text-white bg-success border-0 position-fixed top-0 start-0 m-3"
     role="alert" aria-live="assertive" aria-atomic="true" data-bs-delay="2000">
    <div class="d-flex">
        <div class="toast-body">
            <span th:text="${message}"></span>
        </div>
        <button type="button" class="btn-close btn-close-white me-2 m-auto" data-bs-dismiss="toast"
                aria-label="Close"></button>
    </div>
</div>

<div id="errorToast" class="toast align-items-center text-white bg-danger border-0 position-fixed top-0 start-0 m-3"
     role="alert" aria-live="assertive" aria-atomic="true" data-bs-delay="2000">
    <div class="d-flex">
        <div class="toast-body">
            <span th:text="${createError}"></span>
        </div>
        <button type="button" class="btn-close btn-close-white me-2 m-auto" data-bs-dismiss="toast"
                aria-label="Close"></button>
    </div>
</div>

<div class="content" id="content">
    <div th:replace="~{components/utils/header-user :: header(${user})}"></div>
    <div class="container mt-5">
        <form th:action="@{/formats}" method="post" th:object="${formatRequest}">
            <div th:replace="~{components/formats/general_info/form-format :: formularioBasico(${formatRequest})}"></div>
            <div class="mt-4 text-end mb-3">
                <button type="submit" class="btn btn-primary">Guardar información general</button>
            </div>
        </form>
        <div th:if="${formatRequest.formatId != null}">
            <div th:replace="~{components/formats/modules/modules-format :: modulosExtra(${projects})}"></div>
        </div>
    </div>
</div>
<!-- Bootstrap y JS -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script th:src="@{/js/components/utils/togglebtn.js}"></script>
<script th:src="@{/js/components/utils/alert.js}"></script>
<script th:src="@{/js/components/users/delete_teacher.js}"></script>
<script th:src="@{/js/components/users/activate.js}"></script>
<script th:src="@{/js/components/projects/projects_format.js}"></script>
<script th:src="@{/js/components/projects/file_uploader.js}"></script>
<script th:src="@{/js/components/directions/directions_format.js}"></script>
<script th:src="@{/js/components/events/events_format.js}"></script>
<script th:src="@{/js/components/activities/other_activities_format.js}"></script>
<script th:src="@{/js/components/products/products_format.js}"></script>
<script th:src="@{/js/components/projects/publish_project.js}"></script>
<script th:src="@{/js/components/directions/publish_direction.js}"></script>
<script th:src="@{/js/components/projects/delete_project.js}"></script>
<script th:src="@{/js/components/directions/delete_direction.js}"></script>
</body>
</html>
