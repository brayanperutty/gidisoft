<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard - GIDISOFT</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">
    <link rel="stylesheet" th:href="@{/css/dashboard.css}">
</head>
<body>
<div id="successToast" class="toast align-items-center text-white bg-success border-0 position-fixed top-0 start-0 m-3"
     role="alert" aria-live="assertive" aria-atomic="true" data-bs-delay="2000">
    <div class="d-flex">
        <div class="toast-body">
            <span th:text="${message}"></span>
        </div>
        <button type="button" class="btn-close btn-close-white me-2 m-auto" data-bs-dismiss="toast"
                aria-label="Close"></button>
    </div>
</div>

<div id="errorToast" class="toast align-items-center text-white bg-danger border-0 position-fixed top-0 start-0 m-3"
     role="alert" aria-live="assertive" aria-atomic="true" data-bs-delay="2000">
    <div class="d-flex">
        <div class="toast-body">
            <span th:text="${createError}"></span>
        </div>
        <button type="button" class="btn-close btn-close-white me-2 m-auto" data-bs-dismiss="toast"
                aria-label="Close"></button>
    </div>
</div>

<!-- Menú lateral -->
<div class="sidebar collapsed" id="sidebar">
    <div th:replace="~{components/menu}"></div>
</div>

<div class="content" id="content">
    <div th:replace="~{components/header-user :: header(${user})}"></div>
    <div class="container mt-5">
        <form th:action="@{/formats}" method="post">
            <!-- Encabezado del formulario -->
            <div class="border p-3 mb-4 border border-dark">
                <div class="row d-flex align-items-center justify-content-center">
                    <div class="col-md-6 text-center">
                        <img th:src="@{/img/Logo-vertical.jpg}" alt="Logo" class="img-fluid mb-2"
                             style="max-height: 110px;">
                        <p class="mb-0 fw-bold">FORMATO</p>
                        <p class="mb-0">INFORME DE GESTIÓN</p>
                    </div>
                    <div class="col-md-6">
                        <div class="row mb-2">
                            <div class="col-md-6 mb-2">
                                <label class="form-label fw-bold">Código:</label>
                                <input type="text" class="form-control border border-dark" name="code">
                            </div>
                            <div class="col-md-6 mb-2">
                                <label class="form-label fw-bold">Versión:</label>
                                <input type="text" class="form-control border border-dark" name="version">
                            </div>
                            <div class="col-md-6 mb-2">
                                <label class="form-label fw-bold">Fecha:</label>
                                <input type="date" class="form-control border border-dark" name="date">
                            </div>
                            <div class="col-md-6 mb-2">
                                <label class="form-label fw-bold">Página:</label>
                                <input type="text" class="form-control border border-dark" name="pagina"
                                       value="1 de 1">
                            </div>
                        </div>
                    </div>
                </div>
            </div>

            <div class="card mb-3 border border-dark">
                <div class="card-body">
                    <div class="row text-center">
                        <!-- Elaboró -->
                        <div class="col-md-4">
                            <div class="card-header fw-bold bg-primary-subtle">Elaboró</div>
                            <div class="card-header">
                                <input type="text" class="form-control border border-dark" id="createdBy"
                                       name="managerUsers.createdBy" required>
                            </div>
                        </div>

                        <!-- Revisó -->
                        <div class="col-md-4">
                            <div class="card-header fw-bold bg-primary-subtle">Revisó</div>
                            <div class="card-header">
                                <input type="text" class="form-control border border-dark" id="reviewBy"
                                       name="managerUsers.reviewBy"
                                       required>
                            </div>
                        </div>
                        <!-- Aprobó -->
                        <div class="col-md-4">
                            <div class="card-header fw-bold bg-primary-subtle">Aprobó</div>
                            <div class="card-header">
                                <input type="text" class="form-control border border-dark" id="approveBy"
                                       name="managerUsers.approveBy"
                                       required>
                            </div>
                        </div>
                    </div>
                </div>
            </div>

            <!-- Datos del responsable -->
            <div class="card mb-3 border border-dark">
                <div class="card-header fw-bold">Datos del proyecto</div>
                <div class="card-body">
                    <div class="row mb-3">
                        <div class="col-md-6">
                            <label for="nombre" class="form-label fw-bold">NOMBRE DEL GRUPO DE
                                INVESTIGACIÓN:</label>
                            <input type="text" class="form-control text-center border border-dark" id="nombre"
                                   name="name"
                                   required>
                        </div>
                        <div class="col-md-6">
                            <label for="drive" class="form-label fw-bold">UNIDAD ACADÉMICA A LA QUE SE ENCUENTRA
                                ADSCRITA EL
                                GRUPO:</label>
                            <input type="text" class="form-control text-center border border-dark" id="drive"
                                   name="unity"
                                   required>
                        </div>
                    </div>
                    <div class="row mb-3">
                        <div class="col-md-6">
                            <label for="director" class="form-label fw-bold">DIRECTOR:</label>
                            <input type="hidden" name="directorId" th:value="${director.id}">
                            <input type="text" class="form-control text-center border border-dark" id="director"
                                   th:object="${director}" th:value="${director.getName()}" disabled required>
                        </div>
                        <div class="col-md-6">
                            <label for="deparment" class="form-label fw-bold">DEPARTAMENTO:</label>
                            <input type="text" class="form-control text-center border border-dark"
                                   id="deparment"
                                   name="deparment" required>
                        </div>
                    </div>
                    <div class="row mb-3 d-flex align-items-center justify-content-center">
                        <div class="col-md-6">
                            <label for="faculty" class="form-label fw-bold">FACULTAD:</label>
                            <input type="text" class="form-control text-center border border-dark" id="faculty"
                                   name="faculty" required>
                        </div>
                        <div class="col-md-6">
                            <label for="period" class="form-label fw-bold">SEMESTRE ACADÉMICO:</label>
                            <select class="form-select text-center border border-dark" id="period" name="academicPeriod" required>
                                <option value="" disabled selected hidden>Seleccione el periodo académico</option>
                                <option th:each="year: ${years}" th:value="${year.getId()}" th:text="${year.getValue()}"></option>
                            </select>
                        </div>
                    </div>

                </div>
            </div>

            <div class="card border border-dark mb-3">
                <div class="card-header fw-bold">1. Proyectos de investigación</div>
                <div class="card-body" id="projects-container">
                    <!-- Las secciones de proyecto se insertan aquí -->
                </div>
                <div class="card-footer text-end">
                    <button type="button" class="btn btn-success" onclick="addProject()">+ Agregar Proyecto
                    </button>
                </div>
            </div>

            <div class="card border border-dark mb-3">
                <div class="card-header fw-bold">2. Participación en Dirección de Trabajo de Grado y/o Tesis</div>
                <div class="card-body" id="directions-container">
                    <!-- Las secciones de proyecto se insertan aquí -->
                </div>
                <div class="card-footer text-end">
                    <button type="button" class="btn btn-success" onclick="addDirection()">+ Agregar Participación
                    </button>
                </div>
            </div>

            <div class="card border border-dark mb-3">
                <div class="card-header fw-bold">3. Organización de Eventos de Investigación / Científicos</div>
                <div class="card-body" id="events-container">
                    <!-- Las secciones de proyecto se insertan aquí -->
                </div>
                <div class="card-footer text-end">
                    <button type="button" class="btn btn-success" onclick="addEvent()">+ Agregar Evento
                    </button>
                </div>
            </div>

            <div class="card border border-dark mb-3">
                <div class="card-header fw-bold">4. Otras actividades de Investigación</div>
                <div class="card-body" id="others-activities-container">
                    <!-- Las secciones de proyecto se insertan aquí -->
                </div>
                <div class="card-footer text-end">
                    <button type="button" class="btn btn-success" onclick="addOtherActivities()">+ Agregar Actividad
                    </button>
                </div>
            </div>

            <div class="card border border-dark mb-3">
                <div class="card-header fw-bold">5. Productos</div>
                <div class="card-body" id="products-container">
                    <!-- Las secciones de proyecto se insertan aquí -->
                </div>
                <div class="card-footer text-end">
                    <button type="button" class="btn btn-success" onclick="addProducts()">+ Agregar Producto
                    </button>
                </div>
            </div>


            <div class="mt-4 text-end mb-3">
                <button type="submit" class="btn btn-primary">Enviar Informe</button>
            </div>
        </form>
    </div>
</div>
<!-- Bootstrap y JS -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script th:src="@{/js/components/togglebtn.js}"></script>
<script th:src="@{/js/components/alert.js}"></script>
<script th:src="@{/js/components/delete.js}"></script>
<script th:src="@{/js/components/activate.js}"></script>
<script th:src="@{/js/components/projects_format.js}"></script>
<script th:src="@{/js/components/directions_format.js}"></script>
<script th:src="@{/js/components/events_format.js}"></script>
<script th:src="@{/js/components/other_activities_format.js}"></script>
<script th:src="@{/js/components/products_format.js}"></script>

</body>
</html>
